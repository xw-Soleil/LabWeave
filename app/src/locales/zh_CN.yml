  language:
    title: 语言
    description: |
      界面文字使用的语言。重新启动软件后生效
    options:
      en: English
      zh_CN: 简体中文
      zh_TW: 繁體中文
      zh_TWC: 接地气繁体中文
      id: 印度尼西亚语
  themeMode:
    title: 主题模式
    researchTitle: 浅色 / 深色
    researchDescription: |
      界面和白板用浅色还是深色。标题栏右边的按钮也能切换
    options:
      light: 白天模式
      dark: 黑夜模式
  lightTheme:
    title: 白天主题
  darkTheme:
    title: 黑夜主题
  showTipsOnUI:
    title: 在 UI 中显示提示信息
    description: |
      开启后，屏幕上会有一行提示文本。
      如果您已经熟悉了软件，建议关闭此项以减少屏幕占用
      更多更详细的提示还是建议看菜单栏中的“功能说明书”或官网文档。
  isClassroomMode:
    title: 专注模式
    description: |
      用于教学、培训等场景。
      开启后窗口顶部按钮会透明，鼠标悬浮上去会恢复，可以修改进入退出专注模式的快捷键
  viewerMode:
    title: 浏览模式
    description: |
      开启后禁止通过画布交互修改项目内容，避免触屏误操作。
      仍可移动和缩放视野、选择及框选对象。
  hideCursorInPenMode:
    title: 画笔模式下隐藏鼠标
    description: "开启后，在使用画笔绘制时会隐藏鼠标指针"
  penPressureCurve:
    title: 压感曲线
    description: 调整笔压输入的映射曲线，改变压力与笔画宽度的关系
    options:
      fixed: 固定值（无压感）
      linear: 线性（原始值）
      sqrt: 平方根（中低压力更敏感）
      cbrt: 立方根（低压力最敏感）
      quadratic: 二次抛物线（中高压力更敏感）
      cubic: 三次抛物线（高压力最敏感）
  pin:
    tooltipPin: 固定到右侧快捷栏
    tooltipUnpin: 从右侧快捷栏取消固定
  showQuickSettingsToolbar:
    title: 显示快捷设置栏
    description: |
      控制是否在界面右侧显示快捷操作栏（快捷设置栏）。
      快捷设置栏可以让您快速切换常用设置项的开关状态。
  showRecentFilesThumbnails:
    title: 最近文件面板显示缩略图
    description: |
      控制“最近打开的文件”面板中是否显示工程文件缩略图。
      关闭后可减少界面干扰。
  autoAdjustLineEndpointsByMouseTrack:
    title: 根据鼠标拖动轨迹自动调整生成连线的端点位置
    description: |
      开启后，在拖拽连线时会根据鼠标移动轨迹自动调整连线端点在实体上的位置
      关闭后，连线端点将始终位于实体中心
  autoAdjustLineEndpointsWhenRightDragToBlank:
    title: 右键拖拽式连线在空白位置释放时，自动调整连线端点位置
    description: |
      开启后，右键拖拽连线到空白位置创建文本节点时，会保留源节点的划出边缘，并让新节点从相对边缘接收连线。
      关闭后，这类连线的两端端点都位于实体中心。
  enableRightClickConnect:
    title: 启用右键点击式连线功能
    description: |
      开启后，选中实体并右键点击其他实体时会自动创建连线，且右键菜单仅在空白处显示
      关闭后，可以在实体上右键直接打开菜单，不会自动创建连线
  rightClickConnectEdgeType:
    title: 右键连线默认类型
    description: 右键点击式连线时默认创建的连线类型
    options:
      normal: 普通连线
      arc: 圆弧线
  defaultEdgeLineType:
    title: 新建连线默认线体样式
    description: 拖拽创建连线时，连线的默认线体样式
    options:
      solid: 实线
      dashed: 虚线
      double: 双实线
  defaultEdgeArrowType:
    title: 新建连线默认箭头样式
    description: 拖拽创建连线时，连线的默认箭头样式
    options:
      default: 默认燕尾箭头
      hollow-triangle: 空心三角（继承）
      filled-triangle: 实心三角
      hollow-diamond: 空心菱形（聚合）
      filled-diamond: 实心菱形（组合）
  lineStyle:
    title: 连线样式
    description: |
      白板上所有连线画成直线还是平滑的曲线
    options:
      straight: 直线
      bezier: 贝塞尔曲线
      vertical: 垂直折线（已废弃⚠️）
  hideArrowWhenPointingToConnectPoint:
    title: 连线指向质点时隐藏箭头
    description: |
      开启后，当连线的目标是质点时，不渲染箭头，只保留线条本身。
      对直线、贝塞尔曲线和垂直折线都生效。
  isRenderCenterPointer:
    title: 显示中心十字准星
    description: |
      开启后，屏幕中心中心会显示一个十字准星，用于用于指示快捷键创建节点的位置
  centerCrosshairColor:
    title: 十字准星颜色
    description: 设置中心十字准星的颜色
  centerCrosshairShape:
    title: 十字准星形状
    description: 选择中心十字准星的形状样式
    options:
      crossDot: 十字+中心点
      tightCross: 紧密十字
      xShape: X形
      circleDot: 圆形中心点
      iBeam: 动态工字型
  centerCrosshairAlpha:
    title: 十字准星不透明度
    description: 设置中心十字准星的不透明度
  showGrid:
    title: 显示网格
  showBackgroundHorizontalLines:
    title: 显示水平背景线
    description: |
      水平线和垂直线可以同时打开，实现网格效果
  showBackgroundVerticalLines:
    title: 显示垂直背景线
    description: |
      在白板背景上画竖线。和「显示水平背景线」一起打开就是网格
  showBackgroundDots:
    title: 显示背景点
    description: |
      这些背景点是水平线和垂直线的交点，实现洞洞板的效果
  showBackgroundCartesian:
    title: 显示背景直角坐标系
    description: |
      开启后，将会显示x轴、y轴和刻度数字
      可以用于观测一些节点的绝对坐标位置
      也能很直观的知道当前的视野缩放倍数
  windowBackgroundAlpha:
    title: 窗口背景透明度
    description: |
      白板背景的不透明度：1 是完全不透明，调低后能透过窗口看到后面的桌面。
      从 1 改成小于 1 的值，要重新打开文件才生效
  windowBackgroundOpacityAfterOpenClickThrough:
    title: 开启点击穿透后的窗口背景透明度
    description: |
      设置在开启点击穿透功能后窗口背景的透明度
  windowBackgroundOpacityAfterCloseClickThrough:
    title: 关闭点击穿透后的窗口背景透明度
    description: |
      设置在关闭点击穿透功能后窗口背景的透明度
  showDebug:
    title: 显示调试信息
    description: |
      通常为开发者使用
      开启后，屏幕左上角将会显示调试信息。
      若您遇到bug截图反馈时，建议开启此选项。
  enableTagTextNodesBigDisplay:
    title: 标签文本节点巨大化显示
    description: |
      开启后，标签文本节点的显示在摄像机缩小到广袤的全局视野时，
      标签会巨大化显示，以便更容易辨识整个文件的布局分布
  forceHideTextNodeBorder:
    title: 强制隐藏文本节点边框
    description: |
      开启后，无论文本节点的边框样式设置了什么格式（如虚线、实线、无边框），都强制不显示任何边框。
      关闭后，文本节点将按照各自的边框样式设置正常显示边框。
  textNodeInitBorderStyle:
    title: 新建文本节点的边框样式
    description: |
      创建新文本节点时默认使用的边框样式。
      实线：标准实线边框
      虚线：虚线边框
      无边框：不显示边框
    options:
      solid: 实线
      dashed: 虚线
      none: 无边框
  defaultFontFamily:
    title: 默认字体
    description: |
      设置画布默认字体
  showTreeDirectionHint:
    title: 显示树形生长方向提示
    description: |
      选中文本节点时，在节点四周显示 tab/W W/S S/A A/D D 等键盘树形生长方向提示。
      关闭后不再渲染这些提示文字。
  colorPanelMouseEnterPreview:
    title: 鼠标划过色盘时立即预览颜色
    description: |
      开启后，鼠标在右键菜单色盘上悬浮时会立即将颜色应用到已选中的元素上，松开后可继续调整。
      关闭后需要单击色块才能更改颜色。
  newNodeScaleByCamera:
    title: 新建文本节点时，根据视野缩放等级自动设置节点大小
    description: |
      开启后，创建文本节点时会根据当前视野缩放级别自动调整节点字体大小，
      使节点在屏幕上的视觉大小保持恒定。默认关闭。
  newNodeScaleByCameraOffset:
    title: 新建文本节点时，根据视野缩放等级自动设置大小的级别修正偏移
    description: 配合"根据视野自动设置节点大小"使用。正数使新建节点更大，负数使新建节点更小。
  sectionBitTitleRenderType:
    title: 框的缩略大标题渲染类型
    description: |
      视野拉远、分组框在屏幕上变得很小时，框的标题怎么显示：不显示、在框顶部显示一行小字，或者用半透明的大字盖住整个框
    options:
      none: 不渲染（节省性能）
      top: 顶部小字
      cover: 半透明覆盖框体（最佳效果）
  sectionBigTitleThresholdRatio:
    title: 框的缩略大标题显示阈值
    description: |
      当框的最长边小于视野范围最长边的此比例时，显示缩略大标题
  sectionBigTitleCameraScaleThreshold:
    title: 框的缩略大标题相机缩放阈值
    description: |
      当摄像机缩放比例大于此阈值时，不显示缩略大标题
      摄像机缩放比例需要打开调试信息才能显示
  sectionBigTitleOpacity:
    title: 框的缩略大标题透明度
    description: |
      控制半透明覆盖大标题的透明度，取值范围0-1
  hideSectionContentsWhenBigTitleActive:
    title: 大标题形态时隐藏框内物体
    description: |
      开启后，当分组框进入大标题渲染形态时，不再渲染其内部的任何物体。
      包括内部节点、图片、子分组框、涂鸦和相关连线。
      此选项默认关闭。
  sectionBackgroundFillMode:
    title: 框的背景颜色填充方式
    description: |
      控制分组框的背景颜色填充方式
      完整填充：填充整个框的背景（默认方式，有透明度化和遮罩顺序判断）
      仅标题条：只填充顶部标题那一小条的部分
    options:
      full: 完整填充
      titleOnly: 仅标题条
  sectionInitBorderStyle:
    title: 新建分组框的边框样式
    description: |
      创建新分组框时默认使用的边框样式。
      实线：标准实线边框
      虚线：虚线边框
      无边框：不显示边框（仍可通过背景色区分范围）
    options:
      solid: 实线
      dashed: 虚线
      none: 无边框
  autoEnterSectionEditMode:
    title: 创建分组框后自动进入编辑状态
    description: 开启后，使用 Ctrl+G 创建分组框时会自动弹出标题输入框，方便快速命名。关闭则只选中新分组框，不进入编辑。
  alwaysShowDetails:
    title: 始终显示节点详细信息
    description: |
      开启后，无需鼠标移动到节点上时，才显示节点的详细信息。
  exportMermaidIncludeNodeDetails:
    title: 包含节点详情
    description: |
      导出 Mermaid 时，将节点和分组框的详情作为注释附在源码中，方便保存或交给 AI 阅读。
      注释不会显示在渲染后的图中；此选择会自动保存。
  nodeDetailsPanel:
    title: 节点详细信息面板
    description: |
      编辑节点详细信息时用哪种编辑器。当前版本没有读取这一项，改了不会有变化
    options:
      small: 小型面板
      vditor: vditor markdown编辑器
  useNativeTitleBar:
    title: 使用原生标题栏（需要重启应用）
    description: |
      开启后，窗口顶部将会出现原生的标题栏，而不是模拟的标题栏。
  protectingPrivacy:
    title: 隐私保护
    description: |
      用于反馈问题截图时，开启此项之后将根据所选模式替换文字，以保护隐私。
      仅作显示层面的替换，不会影响真实数据
      反馈完毕后可再关闭，复原
  protectingPrivacyMode:
    title: 隐私保护模式
    description: |
      选择隐私保护时的文字替换方式
    options:
      secretWord: 统一替换（汉字→㊙，字母→a/A，数字→6）
      caesar: 凯撒移位（所有字符往后移动一位）
  entityDetailsFontSize:
    title: 实体详细信息字体大小
    description: |
      设置舞台上渲染的实体详细信息的文字大小，单位为像素
  entityDetailsLinesLimit:
    title: 实体详细信息行数限制
    description: |
      限制舞台上渲染的实体详细信息的最大行数，超过限制的部分将被省略
  entityDetailsWidthLimit:
    title: 实体详细信息宽度限制
    description: |
      限制舞台上渲染的实体详细信息的最大宽度（单位为px像素，可参考背景网格坐标轴），超过限制的部分将被换行
  windowCollapsingWidth:
    title: 迷你窗口的宽度
    description: |
      点击切换至迷你窗口时，窗口的宽度，单位为像素
  windowCollapsingHeight:
    title: 迷你窗口的高度
    description: |
      点击切换至迷你窗口时，窗口的高度，单位为像素
  renderEffect:
    title: 渲染特效
    description: 是否渲染特效，如果卡顿可以关闭
  compatibilityMode:
    title: 兼容模式
    description: |
      预留给显卡兼容问题的另一种渲染方式。当前版本没有读取这一项，开关不会有变化
  historySize:
    title: 历史记录大小
    description: |
      这个数值决定了您最多ctrl+z撤销的次数
      如果您的电脑内存非常少，可以适当调小这个值
  resizePastedImages:
    title: 图片尺寸压缩
    description: |
      开启后，长或宽超过尺寸限制的图片将被等比缩放
  compressImageToWebp:
    title: 图片颜色压缩
    description: |
      将图片转换为 WebP 格式以减小文件体积
  webpQuality:
    title: WebP 质量
    description: |
      WebP 编码质量，1.0 为无损，数值越低文件体积越小。仅在开启「图片颜色压缩」时生效
  compressImageToBlackAndWhite:
    title: 黑白压缩
    description: |
      将图片转换为黑白图像以减小文件体积。
      开启后，尺寸压缩和颜色压缩将失效
  blackAndWhiteThreshold:
    title: 黑白阈值
    description: |
      0 为完整灰度，1 为纯黑白（仅黑和纯白两种颜色）。
      仅在开启「黑白压缩」时生效
  wrapImageInGroup:
    title: 粘贴/拖入图片时自动套框
    description: |
      开启后，从剪贴板粘贴或从外部拖入的图片将被自动包裹在一个分组框（Section）中。
  maxPastedImageSize:
    title: 粘贴到舞台的图片的尺寸限制（像素）
    description: |
      长或宽超过此尺寸的图片，其长或宽的最大值将会被限制为此大小
      同时保持长宽比不变，仅在开启“图片尺寸压缩”时生效
  isPauseRenderWhenManipulateOvertime:
    title: 超过一定时间未操作舞台，暂停渲染
    description: |
      开启后，超过若干秒未做出舞台操作，舞台渲染会暂停，以节省CPU/GPU资源。
  pauseRenderWhenTabUnfocused:
    title: 标签页失去焦点后暂停渲染
    description: |
      开启后，非当前激活的标签页将暂停渲染循环，以节省 CPU/GPU 资源。
      关闭后，所有已打开的资源标签页会持续渲染（可能增加资源占用）。
  renderOverTimeWhenNoManipulateTime:
    title: 超时停止渲染舞台的时间（秒）
    description: |
      超过一定时间未做出舞台操作，舞台渲染会停止，以节省CPU/GPU资源。
      必须在上述“超时暂停渲染”选项开启后才会生效。
  ignoreTextNodeTextRenderLessThanFontSize:
    title: 当渲染字体大小小于一定值时，不渲染文本节点内的文字及其详细信息
    description: |
      开启后，当文本节点的渲染字体大小小于一定值时，(也就是观察宏观状态时)
      不渲染文本节点内的文字及其详细信息，这样可以提高渲染性能，但会导致文本节点的文字内容无法显示
  isEnableEntityCollision:
    title: 实体碰撞检测
    description: |
      开启后，实体之间会进行碰撞挤压移动，可能会影响性能。
      建议关闭此项，目前实体碰撞挤压还不完善，可能导致爆栈
  isEnableSectionCollision:
    title: 启用框碰撞
    description: |
      开启后，框与框之间会自动进行碰撞排斥（推开重叠的同级框），避免框重叠。
  autoRefreshStageByMouseAction:
    title: 鼠标操作时自动刷新舞台
    description: |
      开启后，鼠标操作(拖拽移动视野)会自动刷新舞台
      防止出现打开某个文件后，图片未加载成功还需手动刷新的情况
  maxFps:
    title: 最大帧率 (活跃)
    description: 窗口处于活跃状态时的最大帧率限制
  maxFpsUnfocused:
    title: 最大帧率 (后台)
    description: 窗口失去焦点时的最大帧率限制
  autoNamerTemplate:
    title: 创建节点时自动命名模板
    description: |
      输入`{{i}}` 代表节点名称会自动替换为编号，双击创建时可以自动累加数字。
      例如`n{{i}}` 会自动替换为`n1`, `n2`, `n3`…
      输入`{{date}}` 会自动替换为当前日期，双击创建时可以自动更新日期。autoNamerTemplate
      输入`{{time}}` 会自动替换为当前时间，双击创建时可以自动更新时间。
      可以组合使用，例如`{{i}}-{{date}}-{{time}}`
  autoNamerSectionTemplate:
    title: 创建框时自动命名模板
    description: |
      输入`{{i}}` 代表节点名称会自动替换为编号，双击创建时可以自动累加数字。
      例如`n{{i}}` 会自动替换为`n1`, `n2`, `n3`…
      输入`{{date}}` 会自动替换为当前日期，双击创建时可以自动更新日期。
      输入`{{time}}` 会自动替换为当前时间，双击创建时可以自动更新时间。
      可以组合使用，例如`{{i}}-{{date}}-{{time}}`
  autoNamerDetailsTemplate:
    title: 创建节点时自动填入的详细信息
    description: |
      创建文本节点时，自动将此内容填入节点的「详细信息」文本框。
      留空则不自动填入任何内容。
      支持与标题相同的模板语法：
      输入`{{i}}` 会自动替换为编号（与标题保持一致）。
      输入`{{date}}` 会自动替换为当前日期。
      输入`{{time}}` 会自动替换为当前时间。
  autoNamerTreeNodeTemplate:
    title: Tab键树形生长节点的初始名称模板
    description: |
      在键盘模式下按Tab键生长新节点时，新节点的初始名称。
      输入`{{i}}` 会自动替换为编号，避免名称重复。
      例如`Node_{{i}}` 会自动替换为`Node_0`, `Node_1`, `Node_2`…
      输入`{{date}}` 会自动替换为当前日期。
      输入`{{time}}` 会自动替换为当前时间。
      可以组合使用，例如`Node_{{i}}-{{date}}`
  autoSaveWhenClose:
    title: 点击窗口右上角关闭按钮时自动保存工程文件
    description: |
      关闭软件时，如果有未保存的工程文件，会弹出提示框询问是否保存。
      开启此选项后，关闭软件时会自动保存工程文件。
      所以，建议开启此选项。
    researchTitle: 关闭窗口时自动保存
    researchDescription: |
      关闭窗口前，先把已经保存过、又有改动的白板存一遍。还没保存过的草稿仍会提示。打开「自动保存」时也会这样做
  autoSave:
    title: 开启自动保存
    description: |
      自动保存当前文件
      此功能目前仅对已有路径的文件有效，不对草稿文件生效！
    researchTitle: 自动保存
    researchDescription: |
      已经保存过的白板，停手约 5 秒后自动保存，另外按下面的间隔定时再存一次。草稿还没有保存位置，不会自动保存
  autoSaveInterval:
    title: 开启自动保存间隔（秒）
    description: |
      注意：目前计时时间仅在软件窗口激活时计时，软件最小化后不会计时。
    researchTitle: 定时保存间隔（秒）
    researchDescription: |
      打开「自动保存」后每隔多少秒定时保存一次。窗口在后台或最小化时不计时，停手 5 秒后的保存不受影响
  clearHistoryWhenManualSave:
    title: 使用快捷键手动保存时，自动清空历史记录
    description: |
      当使用Ctrl+S快捷键手动保存文件时，自动清空操作历史记录。
      开启此选项可以减少内存占用并保持界面整洁。
  historyManagerMode:
    title: 历史记录管理器模式
    description: |
      撤销记录怎么存：「内存高效」只记每一步改了什么，省内存，撤销、重做稍慢；「时间高效」每一步存一份完整副本，撤销快，但白板大时占内存多
    options:
      memoryEfficient: 内存高效模式
      timeEfficient: 时间高效模式
  autoBackup:
    title: 开启自动备份
    description: |
      自动备份当前文件到备份文件夹
      如果是草稿，则会存储在指定的路径
  autoBackupInterval:
    title: 自动备份间隔（秒）
    description: |
      自动备份过于频繁可能会产生大量的备份文件
      进而占用磁盘空间
  autoBackupLimitCount:
    title: 自动备份最大数量
    description: |
      自动备份的最大数量，超过此数量将会删除旧的备份文件
  autoBackupCustomPath:
    title: 自定义自动备份路径
    description: |
      设置自动备份文件的保存路径，如果为空则使用默认路径
  autoBackupCustomPath2:
    title: 自定义自动备份路径（第二路径）
    description: |
      第一备份路径为空或备份失败时，将尝试使用第二备份路径
      第二备份路径也不可用时，将回退到默认路径
  autoBackupStrategy:
    title: 自动备份策略
    description: |
      选择备份文件的保存方式：default（备份文件夹）、sideBySide（与原始文件同目录）、subfolder（{filename}_backup 子文件夹）
    researchDescription: |
      备份文件放在哪里。一律放进备份文件夹：填了「自定义自动备份路径」就用它，否则用软件自己的缓存目录，不会在研究文件夹里留下备份文件
    options:
      default: 默认（备份文件夹）
      sideBySide: 同目录备份
      subfolder: 子文件夹备份（{filename}_backup）
  scaleExponent:
    title: 视角缩放速度
    description: |
      《当前缩放倍数》会不断的以一定倍率无限逼近《目标缩放倍数》
      当逼近的足够近时（小于0.0001），会自动停止缩放
      值为1代表缩放会立刻完成，没有中间的过渡效果
      值为0代表缩放永远都不会完成，可模拟锁死效果
      注意：若您在缩放画面时感到卡顿，请调成1
    researchTitle: 键盘缩放的过渡快慢
    researchDescription: |
      按快捷键放大、缩小时，画面过渡到目标大小有多快。数值越大越快，1 表示一下到位。滚轮和触控板的缩放不受它影响
  cameraZoomInLimitBehavior:
    title: 放大到极限时的行为
    description: |
      当视野缩放放大到超过缩放上限时触发
    options:
      macro: 回到宏观
      micro: 回到微观的极限
      reset: 回到标准大小（缩放级别1）
  cameraZoomOutLimitBehavior:
    title: 缩小到极限时的行为
    description: |
      当视野缩放缩小到低于缩放下限时触发
    options:
      macro: 回到宏观
      micro: 回到微观的极限
      reset: 回到标准大小（缩放级别1）
  cameraKeyboardScaleRate:
    title: 视角缩放键盘速率
    description: |
      每次通过一次按键来缩放视野时，视野的缩放倍率
      值为0.2代表每次放大会变为原来的1.2倍，缩小为原来的0.8倍
      值为0代表禁止通过键盘缩放
  scaleCameraByMouseLocation:
    title: 视角缩放根据鼠标位置
    description: |
      开启后，缩放视角的中心点是鼠标的位置
      关闭后，缩放视角的中心点是当前视野的中心
    researchTitle: 以鼠标为中心缩放
    researchDescription: |
      开着时，滚轮、双指捏合缩放都以鼠标所在的位置为中心；关掉后以画面中心为中心
  allowMoveCameraByWSAD:
    title: 允许使用W S A D按键移动视角
    description: |
      开启后，可以使用W S A D按键来上下左右移动视角
      关闭后，只能使用鼠标来移动视角，不会造成无限滚屏bug
  allowGlobalHotKeys:
    title: 允许使用全局热键
    description: |
      开启后，可以使用全局热键来触发一些操作
  cameraFollowsSelectedNodeOnArrowKeys:
    title: 通过方向键切换选中节点时，视野跟随移动
    description: |
      开启后，使用键盘移动节点选择框时，视野跟随移动
  arrowKeySelectOnlyInViewport:
    title: 方向键切换选择限制在视野内
    description: |
      开启后，使用方向键（上下左右）切换选择节点时，只会选择当前视野内可见的物体。
      关闭后，可以选择到视野外的物体（相机会自动跟随）。
  cameraKeyboardMoveReverse:
    title: 视角移动键盘反向
    description: |
      开启后，W S A D按键的移动视角方向会相反
      原本的移动逻辑是移动悬浮在画面上的摄像机，但如果看成是移动整个舞台，这样就反了
      于是就有了这个选项
  cameraKeyboardScaleReverse:
    title: 视角缩放键盘反向
    description: |
      开启后，[=起飞（缩小），]=降落（放大）
      关闭后，[=降落（放大），]=起飞（缩小）
  cameraResetViewPaddingRate:
    title: 根据选择节点重置视野时，边缘留白系数
    description: |
      框选一堆节点或一个节点，并按下快捷键或点击按钮来重置视野后
      视野会调整大小和位置，确保所有选中内容出现在屏幕中央并完全涵盖
      由于视野缩放大小原因，此时边缘可能会有留白
      值为1 表示边缘完全不留白。（非常放大的观察）
      值为2 表示留白内容恰好为自身内容的一倍
  cameraResetMaxScale:
    title: 摄像机重置视野后最大的缩放值
    description: |
      选中一个面积很小的节点时，摄像机不会完全覆盖这个节点的面积范围，否则太大了。
      而是会放大到一个最大值，这个最大值可以通过此选项来调整
      建议开启debug模式下观察 currentScale 来调整此值
  allowAddCycleEdge:
    title: 允许在节点之间添加自环
    description: |
      开启后，节点之间可以添加自环，即节点与自身相连，用于状态机绘制
      默认关闭，因为不常用，容易误触发
  enableDragNodeShakeDetachFromEdge:
    title: 允许拖拽摇晃从连线中脱离节点
    description: |
      开启后，拖拽单个节点时快速摇晃鼠标，可自动将节点从连线结构中脱离
      默认关闭，防止误触发
  enableDragEdgeRotateStructure:
    title: 允许拖拽连线旋转结构
    description: |
      开启后，可以通过拖拽选中的连线来旋转节点结构
      这允许您轻松调整相连节点的方向
  enableCtrlWheelRotateStructure:
    title: 允许Ctrl+鼠标滚轮旋转结构
    description: |
      开启后，可以按住Ctrl键（Mac系统为Command键）并滚动鼠标滚轮来旋转节点结构
      这允许您精确调整相连节点的方向
  autoLayoutWhenTreeGenerate:
    title: 生长节点时自动更新布局
    description: |
      开启后，生长节点时自动更新布局
      此处的生长节点指tab和\键生长节点
  autoLayoutWhenSectionCollapseToggle:
    title: 折叠/展开分组框时自动格式化所在节点树
    description: |
      开启后，折叠或展开分组框时，若该分组框与其他节点有连线，
      则自动触发其所在节点树的树形结构格式化（等同于 Alt+Shift+F）
  enableTreeGenerateConnectByProbe:
    title: 启用 Tab 探针连接已有节点
    description: |
      开启后，按 Tab 生长节点前会先沿当前生长方向探测是否命中已有节点。
      命中时会直接连接到已有节点，并渲染探针虚线与预览连线。
      关闭后，Tab 将始终走新建节点流程，也不再渲染这些探针提示。
  treeGenerateInheritParentColor:
    title: 生长节点时继承父节点颜色
    description: |
      开启后，通过 Tab 或 \ 生长出来的新节点会继承父节点颜色
      关闭后，新节点不再自动继承父节点颜色
  enableTabGenerateNodeInInput:
    title: 在输入状态下也能通过深度生长快捷键创建子节点
    description: |
      开启后，在文本节点编辑状态下，按下深度生长快捷键（默认为 Tab）也可以创建子节点
      关闭后，只有在非编辑状态下才能通过深度生长快捷键创建子节点
      注意：深度生长快捷键不支持序列型快捷键（如 e tab），请确保将其设置为单个按键
  enableBackslashGenerateNodeInInput:
    title: 在输入状态下也能通过广度生长快捷键创建同级节点
    description: |
      开启后，在文本节点编辑状态下，按下广度生长快捷键（默认为 \）也可以创建同级节点
      关闭后，只有在非编辑状态下才能通过广度生长快捷键创建同级节点
      注意：广度生长快捷键不支持序列型快捷键（如 e \），请确保将其设置为单个按键
  moveAmplitude:
    title: 视角移动加速度
    description: |
      此设置项用于 使用W S A D按键来上下左右移动视角时的情景
      可将摄像机看成一个能朝四个方向喷气的 悬浮飞机
      此加速度值代表着喷气的动力大小，需要结合下面的摩擦力设置来调整速度
  moveFriction:
    title: 视角移动摩擦力系数
    description: |
      此设置项用于 使用W S A D按键来上下左右移动视角时的情景
      摩擦系数越大，滑动的距离越小，摩擦系数越小，滑动的距离越远
      此值=0时代表 绝对光滑
  gamepadDeadzone:
    title: 游戏手柄死区
    description: |
      此设置项用于 游戏手柄控制视角时的情景
      手柄的输入值在0-1之间，此值越小，手柄的输入越敏感
      死区越大，手柄的输入越趋于0或1，不会产生太大的变化
      死区越小，手柄的输入越趋于中间值，会产生较大的变化
  mouseRightDragBackground:
    title: 右键拖动背景的操作
    description: |
      在白板空白处按住右键拖动时做什么。「移动视野」：拖着整块白板走，这时中键拖动变成斩断；「斩断并删除物体」：拖出一条切割线，松开后线经过的连线会被剪断，碰到的物体会被删除
    researchTitle: 右键拖动空白处
    researchDescription: |
      在白板空白处按住右键拖动时做什么。「移动视野」：拖着整块白板走（推荐）；「斩断并删除物体」：拖出一条切割线，松开后线经过的连线会被剪断，碰到的物体会被删除。中键拖动始终是移动视野
    options:
      cut: 斩断并删除物体
      moveCamera: 移动视野
  enableSpaceKeyMouseLeftDrag:
    title: 启用空格键+鼠标左键拖拽移动
    description: 按下空格键并使用鼠标左键拖拽来移动视野
  mouseLeftMode:
    title: 左键模式切换
    description: |
      鼠标左键在白板上做什么：选择并移动物体、用画笔涂画，或者连线与劈砍。每次启动软件都会恢复成「选择并移动」
    options:
      selectAndMove: 选择并移动
      draw: 画图
      connectAndCut: 连线与劈砍
  doubleClickMiddleMouseButton:
    title: 空白处双击中键鼠标
    description: |
      在舞台空白处将滚轮键快速按下两次时执行的操作。默认是重置视野。
      关闭此选项，可以防止误触发。
    options:
      adjustCamera: 调整视野
      none: 无操作
  doubleClickMiddleMouseButtonOnEntity:
    title: 实体上双击中键鼠标
    description: |
      在实体（文本节点等）上双击中键时执行的操作。
      打开内容URL/文件的逻辑：文本节点优先取详细信息第一行，其次取节点文本；其他实体取详细信息第一行。
      内容为网址则用浏览器打开，为文件路径（支持相对路径）则用系统默认程序打开，.prg文件则在软件内打开。
    options:
      openUrl: 打开内容URL/文件
      none: 无操作
  doubleClickEmptySpaceAction:
    title: 空白处双击操作
    description: |-
      在空白处双击时执行的操作。
    options:
      createTextNode: 创建文本节点
      none: 无操作
  textNodeContentLineBreak:
    title: 文本节点换行方案
    options:
      enter: Enter
      ctrlEnter: ctrl + Enter
      altEnter: alt + Enter
      shiftEnter: shift + Enter
    description: |
      注意不要和文本节点退出编辑模式的按键一样了，这样会导致冲突
      进而导致无法换行
  textNodeStartEditMode:
    title: 文本节点进入编辑模式
    options:
      enter: Enter
      ctrlEnter: ctrl + Enter
      altEnter: alt + Enter
      shiftEnter: shift + Enter
      space: 空格键
    description: |
      实际上按F2键也可以进入编辑模式，这里还可以再加选一种
  textNodeExitEditMode:
    title: 文本节点退出编辑模式
    options:
      enter: Enter
      ctrlEnter: ctrl + Enter
      altEnter: alt + Enter
      shiftEnter: shift + Enter
    description: |
      实际上按Esc键也可以退出，这里还可以再加选一种
  textNodeExitEditModeOnWheel:
    title: 文本节点编辑时滚动滚轮退出编辑
    description: |
      开启后，在文本节点编辑状态下滚动鼠标滚轮时，会立即退出编辑状态
  textNodeSelectAllWhenStartEditByMouseClick:
    title: 文本节点通过双击开始编辑时自动全选内容
    description: |
      开启后，在文本节点开始编辑时，会全选文本内容
      如果您编辑内容通常是想为了直接更改全部内容，建议开启此选项
      如果更可能是想为了追加内容，建议关闭此选项
  textNodeSelectAllWhenStartEditByKeyboard:
    title: 文本节点通过键盘开始编辑时自动全选内容
    description: |
      开启后，在您按下文本节点编辑模式的按键时，会全选文本内容
  textNodeBackspaceDeleteWhenEmpty:
    title: 当在编辑模式下文本节点无内容时按Backspace键自动删除整个节点
    description: |
      开启后，在编辑文本节点且内容为空时，按下Backspace键会自动删除整个节点
  textNodeBigContentThresholdWhenPaste:
    title: 粘贴时文本节点大内容阈值
    description: |
      当直接在舞台上粘贴文本时，如果文本长度超过此值，将使用手动换行模式
  textNodePasteSizeAdjustMode:
    title: 文本节点粘贴大小调整模式
    description: |
      控制粘贴文本节点时的大小调整方式
    options:
      auto: 总是自动调整
      manual: 总是手动调整
      autoByLength: 根据长度自动调整
  textNodeManualDefaultCharWidth:
    title: 文本节点手动模式默认宽度（中文字符数）
    description: |
      当使用ttt快捷键切换到手动宽度模式时，文本节点的默认宽度。
      单位为中文字符数，例如设置为10表示宽度为10个中文字符。
      英文字符宽度为中文字符的一半。
  textNodeAutoFormatTreeWhenInput:
    title: 文本节点输入时，实时格式化树形结构
    description: |
      当文本节点处于编辑状态并输入内容时，实时对其所在的树形结构进行格式化布局。
      叠放在画布上的文本输入框也会同步跟随节点位置更新。
  treeGenerateCameraBehavior:
    title: 树形生长节点后的镜头行为选项
    description: |
      设置在使用树形深度生长或广度生长功能创建新节点后，镜头的行为方式
    options:
      none: 镜头不动
      moveToNewNode: 镜头移动向新创建的节点
      resetToTree: 重置视野，使视野覆盖当前树形结构的外接矩形
  enableDragAutoAlign:
    title: 鼠标拖动自动吸附对齐节点
    description: |
      开启后，拖动节点并松开时会与其他节点在x轴、y轴方向对齐
  reverseTreeMoveMode:
    title: 反转树形移动模式
    description: |
      开启后，默认移动为树形移动（连带后继节点），按住Ctrl键移动为单一物体移动。关闭时相反。
  enableDragAlignToGrid:
    title: 拖动实体时，吸附到网格
    description: |
      建议在显示中开启横向和纵向网格线，并关闭自动吸附对齐
  enableWindowsTouchPad:
    title: 允许触摸板双指移动操作
    description: |
      在windows系统中，双指上下移动会被识别为滚轮事件。
      双指左右移动会被识别成鼠标横向滚轮的滚动事件。
      如果您是笔记本操作并使用外部鼠标，建议关闭此选项。
  macTrackpadAndMouseWheelDifference:
    title: macbook 的触摸版与鼠标滚轮区分逻辑
    description:
      有的macbook鼠标滚轮是整数，触摸版是小数，有的则相反
      您需要根据实际情况选择一下区分逻辑
      区分方法可点击7次关于界面的软件logo进入“测试界面”后，滑动滚轮和触摸板查看数据反馈
    options:
      trackpadIntAndWheelFloat: 触摸版是整数，鼠标滚动是小数
      tarckpadFloatAndWheelInt: 触摸版是小数，鼠标滚动是整数
  macTrackpadScaleSensitivity:
    title: macbook 的触摸板双指缩放灵敏度
    description:
      值越大，缩放的速度越快
  macEnableControlToCut:
    title: mac下是否启用 control键按下来开始刀斩
    description:
      按下control键，在舞台上移动鼠标，再松开control键，完成一次刀斩
  macMouseWheelIsSmoothed:
    title: macbook 的鼠标滚轮是否平滑
    description:
      有的macbook鼠标滚轮是平滑的，有的则是滚动一格触发一次
      可能取决于您是否安装了Mos等鼠标修改软件
  mouseSideWheelMode:
    title: 鼠标侧边滚轮模式
    description: |
      侧边滚轮就是大拇指上的滚轮
    options:
      zoom: 缩放
      move: 纵向移动
      moveX: 横向移动
      none: 无操作
      cameraMoveToMouse: 将视野向鼠标位置移动
      adjustWindowOpacity: 调整窗口透明度
      adjustPenStrokeWidth: 调整画笔粗细
  uiScalePercent:
    title: UI 缩放比例
    description: |
      缩放 UI 界面元素和字体的大小，范围 25% ~ 200%。
    researchTitle: 界面缩放（%）
    researchDescription: |
      按钮、面板和菜单文字的大小，100 为原始大小，范围 25 ~ 200
  mouseWheelMode:
    title: 鼠标滚轮模式
    options:
      zoom: 缩放
      move: 纵向移动
      moveX: 横向移动
      none: 无操作
      zoomUI: 缩放UI
  mouseWheelModeReverse:
    title: 鼠标滚轮反向
    description: 开启后鼠标滚轮的效果反转
  mouseWheelWithShiftMode:
    title: 按住 Shift 时，鼠标滚轮模式
    options:
      zoom: 缩放
      move: 纵向移动
      moveX: 横向移动
      none: 无操作
      zoomUI: 缩放UI
  mouseWheelWithShiftModeReverse:
    title: Shift+滚轮反向
    description: 开启后 Shift+滚轮的效果反转
  mouseWheelWithCtrlMode:
    title: 按住 Ctrl 时，鼠标滚轮模式
    description: |
      提示：这里的 Ctrl 是 Control
    options:
      zoom: 缩放
      move: 纵向移动
      moveX: 横向移动
      none: 无操作
      zoomUI: 缩放UI
  mouseWheelWithCtrlModeReverse:
    title: Ctrl+滚轮反向
    description: 开启后 Ctrl+滚轮的效果反转
  mouseWheelWithAltMode:
    title: 按住 Alt 时，鼠标滚轮模式
    description: |
      此功能于2025年4月10日新增
      目前发现还存在问题：win系统下滑动滚轮后需要再点击一次屏幕才能操作舞台
      提示：这里的 Alt 是 Option
    options:
      zoom: 缩放
      move: 纵向移动
      moveX: 横向移动
      none: 无操作
      zoomUI: 缩放UI
  mouseWheelWithAltModeReverse:
    title: Alt+滚轮反向
    description: 开启后 Alt+滚轮的效果反转
  rectangleSelectWhenLeft:
    title: 向左框选的策略
    description: |
      选择鼠标向左框选的策略，包含完全覆盖框选和碰撞框选
      完全覆盖框选是指矩形框选框必须完全覆盖实体的外接矩形
      碰撞框选是指矩形框选框只要碰到一点点实体的外接矩形，就能够选中了
    options:
      intersect: 碰撞框选
      contain: 完全覆盖框选
  rectangleSelectWhenRight:
    title: 向右框选的策略
    description: |
      从左往右拖出选框时怎样算选中：「碰撞框选」是选框碰到物体的一点边就选中；「完全覆盖框选」是物体要整个落在选框里才选中
    options:
      intersect: 碰撞框选
      contain: 完全覆盖框选
  # 声音
  cuttingLineStartSoundFile:
    title: 斩断线开始的声音文件
    description: |
      斩断线右键按下开始时播放的声音文件路径
  connectLineStartSoundFile:
    title: 连接线开始的声音文件
    description: |
      连接线右键按下开始时播放的声音文件路径
  connectFindTargetSoundFile:
    title: 连接线吸附到目标上的声音文件
    description: |
      连接线吸附到目标上时播放的声音文件路径
  cuttingLineReleaseSoundFile:
    title: 斩断线释放的声音文件
    description: |
      释放的时候就是看到刀光刃特效的时候
  alignAndAttachSoundFile:
    title: 对齐的声音文件
    description: |
      鼠标拖动时，对齐节点和时播放的声音文件路径
  uiButtonEnterSoundFile:
    title: 鼠标进入按钮区域的声音
    description: |
      鼠标进入按钮区域的声音
  uiButtonClickSoundFile:
    title: 按钮点击时的声音文件
    description: |
      按钮点击时播放的声音文件路径
  uiSwitchButtonOnSoundFile:
    title: 按钮点击开关按钮时打开的声音
    description: |
      按钮点击开关按钮时打开的声音文件路径
  uiSwitchButtonOffSoundFile:
    title: 按钮点击开关按钮时关闭的声音
    description: |
      按钮点击开关按钮时关闭的声音文件路径
  packEntityToSectionSoundFile:
    title: 打包为框的声音文件
    description: |
      将选中的实体打包到分组框中时播放的声音文件路径
  treeGenerateDeepSoundFile:
    title: 树形深度生长的声音文件
    description: |
      使用Tab键进行树形深度生长时播放的声音文件路径
  treeGenerateBroadSoundFile:
    title: 树形广度生长的声音文件
    description: |
      使用Enter键进行树形广度生长时播放的声音文件路径
  treeAdjustSoundFile:
    title: 树形结构调整的声音文件
    description: |
      格式化树形结构时播放的声音文件路径
  viewAdjustSoundFile:
    title: 视图调整的声音文件
    description: |
      调整视图时播放的声音文件路径
  entityJumpSoundFile:
    title: 物体跳跃的声音文件
    description: |
      物体跳跃移动时播放的声音文件路径
  associationAdjustSoundFile:
    title: 连线调整的声音文件
    description: |
      调整连线、无向边等关联元素时播放的声音文件路径
  agreeTerms:
    title: 同意用户协议
    description: |
      请您仔细阅读并同意用户协议
  allowTelemetry:
    title: 参与用户体验改进计划
    description: |
      如果您启用此项，我们会收集您的使用数据，帮助我们改进软件
      发送的数据仅用于统计，不会包含您的个人隐私信息
      您的数据会在中国香港的云服务器上存储，不会发送到国外
  aiApiBaseUrl:
    title: AI API 地址
    description: |
      支持 OpenAI 兼容格式和 Claude（Anthropic）格式，按下方“AI 接口格式”选择。
      Claude 格式留空时使用官方地址；第三方地址带不带 /v1 都可以，例如 https://api.deepseek.com/anthropic
      本机服务（localhost）可以不填密钥
  aiApiKey:
    title: AI API 密钥
    description: |
      服务商给你的 API 密钥（一般以 sk- 开头）。它以明文保存在这台电脑的设置文件里，不会上传到别处。本机服务（localhost）可以不填
  aiModel:
    title: AI 模型
    description: |
      要调用的模型名称，照服务商文档原样填写（区分大小写），例如 deepseek-chat、gpt-4o-mini、claude-sonnet-4-5
  translateService:
    title: 划词翻译服务
    description: Google 和 Bing 失败时自动互换。AI 使用「AI」页配置的模型接口。
    options:
      google: Google
      bing: Bing
      ai: AI
  readingTheme:
    title: 阅读外观
    description: 阅读预设以及自定义的字体、字号、行高和正文宽度。
  aiCustomHeaders:
    title: AI 请求头
    description: |
      每行一个请求头，格式为“名称: 值”，以 # 开头的行会被忽略
      例如 OpenCode 推理 API 需要：x-opencode-org-id: 你的组织ID
  aiContextWindow:
    title: AI 上下文窗口大小
    description: |
      输入 0 时自动从 OpenRouter 获取；其他兼容服务可手动填写模型的上下文 token 上限
  aiShowTokenCount:
    title: 显示 AI 消耗的token数
    description: |
      启用后，在 AI 操作时显示消耗的token数
  aiAutoApproveMcpTools:
    title: 自动批准 MCP 工具
    description: |
      启用后，MCP 工具无需手动批准即可执行。本地 stdio 进程的首次启动仍需单独确认。
  aiBackend:
    title: AI 来源
    description: |
      用上面填的 AI 接口，还是用你在这台电脑上装好的 AI 程序（Codex、Claude Code 等）。AI 面板标题下面也能随时切换
    options:
      api: AI 接口
      localAgent: 本机 AI 程序
  aiLocalAgent:
    title: 本机 AI 程序
    description: |
      来源选「本机 AI 程序」时用哪一个。标「未实测」的还没试过，可能连不上
    options:
      codex: Codex
      claude: Claude Code
      gemini: Gemini CLI（未实测）
      kimi: Kimi Code（未实测）
      cursor: Cursor（未实测）
      opencode: OpenCode（未实测）
      qodercn: Qoder CN（未实测）
  aiApiFormat:
    title: AI 接口格式
    description: |
      服务商使用的接口格式。大多数服务兼容 OpenAI 格式；Claude 官方接口和 Claude 兼容接口（如 DeepSeek、智谱、Kimi 的 anthropic 地址）选 Claude
    options:
      openai: OpenAI 兼容
      anthropic: Claude（Anthropic）
  aiPdfTextPages:
    title: 给 AI 读的 PDF 页数
    description: |
      把论文放到白板上时，抽取前几页的文字给 AI 参考。填 0 表示不抽取
  researchFolderPath:
    title: 当前项目（研究文件夹）
    description: |
      论文、图片、笔记和白板都放在这个项目文件夹里
  literatureLibraryPath:
    title: 文献库文件夹
    description: 填包含 .litlib 文件和「条目」文件夹的绝对路径。留空时不启用文献库。
  writeAiSidecarOnSave:
    title: 保存时生成 AI 可读的文字版
    description: |
      保存白板时，在旁边的 .workbench 文件夹里写一份 JSON 和 Markdown，方便 AI 工具读懂白板
  researchSession:
    title: 上次打开的白板和面板
  researchShowFullMenu:
    title: 显示完整菜单
    description: |
      打开后显示原版 Project Graph 的全部菜单项
  researchOutsideFileMode:
    title: 研究文件夹外的文件
    description: |
      把研究文件夹外的论文、图片、笔记拖到白板上时怎么处理。复制进来的文件跟着研究文件夹走；直接引用不占空间，但原文件一动卡片就会打不开，卡片右上角会标「外部文件」
    options:
      ask: 每次问我
      copy: 总是复制到「导入」文件夹
      reference: 总是直接引用原文件
  researchWheelBehavior:
    title: 鼠标滚轮
    description: |
      滚轮和触控板双指滑动在白板上做什么。不管选哪种，双指捏合、按住 Ctrl 或 Cmd 再滚动都是缩放；按住 Shift 滚动是左右移动
    options:
      pan: 总是移动（推荐）
      zoom: 总是缩放
      auto: 自动：鼠标滚轮缩放，触控板移动
  researchMouseWheelPanStep:
    title: 鼠标滚轮每格移动多远（像素）
    description: |
      用鼠标滚轮移动白板时，拨一格移动多少。拨得快时一次算好几格。移动会在约 0.15 秒里平滑走完。触控板不受影响
  researchMouseWheelZoomStep:
    title: 鼠标滚轮每格缩放多少（%）
    description: |
      按住 Ctrl 或 Cmd 用鼠标滚轮缩放（或者「鼠标滚轮」选了缩放）时，拨一格放大或缩小百分之几。缩放会在约 0.15 秒里平滑完成。触控板双指捏合不受影响
  mcpAllowEdits:
    title: 允许外部 AI 修改白板
    description: |
      关掉后，外部 AI（Claude Code、Codex 等）只能读：看有哪些白板、读卡片和连线，不能添加、修改或删除任何东西
  mcpAllowDelete:
    title: 允许外部 AI 删除卡片
    description: |
      删除卡片、清空白板这几个工具。白板开着时删了可以撤销；没开时直接改文件，撤销不了
  mcpAllowNetwork:
    title: 允许外部 AI 联网搜图和识图
    description: |
      联网搜图会访问 Openverse；识图会调用你在上面填的 AI 接口，可能产生费用
  textIntegerLocationAndSizeRender:
    title: 文本整数位置和大小渲染
    description: |
      开启后，一切文字的大小和位置都是整数，以节省渲染性能。
      但会出现文字抖动现象。建议配合视角缩放速度调整成1一起使用。
      如果您的电脑使用体验非常卡顿，尤其是在缩放和移动的情况下，可以开启此选项。
  antialiasing:
    title: 抗锯齿
    description: |
      图片在白板上放大、缩小时的平滑程度。越高边缘越平滑，越耗性能；关闭后放大能看到像素格。重新打开文件后生效
    options:
      disabled: 关闭
      low: 低
      medium: 中
      high: 高
  isStealthModeEnabled:
    title: 潜行模式
    description: 开启后鼠标中心出现遮罩（具体形状可在设置中修改），可用于记忆化练习等遮盖场景。
  stealthModeScopeRadius:
    title: 潜行模式范围半径
    description: |
      潜行模式下，鼠标周围那块可见区域的大小（像素）：圆形时是半径，正方形时是边长。范围外的内容被遮住
  stealthModeReverseMask:
    title: 反向遮罩
    description: |
      开启后，狙击镜中心区域会被遮罩，只显示周围区域
  stealthModeMaskShape:
    title: 潜行模式遮罩形状
    description: |
      选择潜行模式下显示区域的形状
    options:
      circle: 圆形
      square: 正方形
      topLeft: 左上角象限
      smartContext: 智能上下文（框或实体）
  soundPitchVariationRange:
    title: 音效音调随机变化范围
    description: 控制音效播放时音调随机变化的程度。范围：0-1200音分（1200音分=1个八度，100音分=1个半音）。值越大，音调变化越明显，越像游戏一样有趣。
  autoImportTxtFileWhenOpenPrg:
    title: 打开PRG文件时自动导入同名TXT文件
    description: 启用后，打开PRG文件时会自动导入同一文件夹下同名TXT文件的内容，并以文本节点形式添加到舞台左下角。
  imageImportOrder:
    title: 图片导入顺序
    description: 导入多张图片时的排序方式
    options:
      mtime: 按文件修改时间排序
      path: 按文件路径字典序排序
  enableAutoEdgeWidth:
    title: 自动调整框之间连线的粗细
    description: |
      开启后，连接两个框（Section）之间的连线会根据框的大小自动调整粗细。
  enableCollisionBoxAutoWidth:
    title: 碰撞箱边框自动粗细
    description: |
      开启后，选中物体的碰撞箱边框粗细会根据缩放自动调整。
      关闭后，所有连线将使用固定粗细。
  showKeyBindHint:
    title: 按下快捷键修饰键后显示匹配的快捷键提示
    description: |
      开启后，当按下 Ctrl/Alt/Shift/Win（Windows）或 ⌘/⌥/⇧/⌃（Mac）等修饰键时，会显示匹配的快捷键提示。
      按住修饰键不放可查看第一页快捷键，松开后再次按下可翻页查看更多。
  showEditModeHint:
    title: 文本节点编辑模式提示
    description: |
      进入文本节点编辑模式时，在节点顶部显示"正在编辑模式"，底部显示换行和退出编辑的快捷键提示。
      关闭后不再渲染这些提示文字。
  textNodeEditModeOutlineOpacity:
    title: 文本节点编辑状态交互区域提示性边框透明度
    description: |
      设置文本节点进入编辑状态时，交互区域边框的透明度。数值越低越透明，越高越明显。

renderer:
  rectangleSelect:
    intersect: 碰撞框选
    contain: 完全覆盖框选

effects:
  CircleChangeRadiusEffect:
    title: 圆形变换半径效果
    description: |
      质点被框选后波纹放大
  CircleFlameEffect:
    title: 圆形径向渐变光闪
    description: |
      存在于各种特效细节中，预劈砍直线与实体矩形切割时、斩断连线时的中点闪烁等
  EntityAlignEffect:
    title: 实体对齐效果
    description: |
      鼠标拖动吸附对齐时产生的高亮虚线
  EntityCreateDashEffect:
    title: 实体创建粉尘凝聚效果
    description: |
      实体创建时，实体周围出现粉尘凝聚
      由于不够美观，已经废弃，不会出现
  EntityCreateFlashEffect:
    title: 实体边框发光效果
    description: |
      在ctrl+滚轮转动实体树、缩放图片、创建节点等情况下出现
      若渲染性能较差，建议关闭此选项
  EntityCreateLineEffect:
    title: 实体散发电路板式线条辐射效果
    description: |
      已经废弃，不会出现
  EntityDashTipEffect:
    title: 实体提示性的粉尘抖动
    description: |
      出现在实体输入编辑结束或进入时，实体周围出现抖动的粉尘
  EntityJumpMoveEffect:
    title: 实体跳跃移动效果
    description: |
      实体跳跃移动时，实体出现一个象征性的跳跃弧线幻影
      用来表示伪z轴的跨越层级移动
  EntityShakeEffect:
    title: 实体抖动效果
    description: |
      像“TickTock”Logo 一样的抖动特效，用于实体出现警告性质的提示
  EntityShrinkEffect:
    title: 实体缩小消失效果
    description: |
      使用Delete键删除实体时，实体出现缩小消失的效果
  ExplodeDashEffect:
    title: 粉尘爆炸效果
    description: |
      用劈砍删除实体时，出现粉尘爆炸
  LineCuttingEffect:
    title: 劈砍时的刀光
    description: |
      劈砍时，出现类似水果忍者一样的刀光
  ConnectionPulseEffect:
    title: 连线光点
    description: 连接节点时显示短暂的细光点。
  LineEffect:
    title: 直线段淡出效果
    description: |
      用于拖拽旋转子树时，连线划过虚影
  NodeMoveShadowEffect:
    title: 节点移动时摩擦地面的粒子效果
    description: |
      布局造成的移动可能也会出现一闪而过的粒子
  PenStrokeDeletedEffect:
    title: 涂鸦被删除时的消失特效
    description: |
      涂鸦被删除时，出现消失的特效
  PointDashEffect:
    title: 在某点出迸发万有引力式的粒子效果
    description: |
      由于万有引力影响性能，此特效已关闭，不会出现
  RectangleLittleNoteEffect:
    title: 矩形闪烁提示效果
    description: |
      在逻辑节点执行时，逻辑节点会闪烁此效果
  RectangleNoteEffect:
    title: 矩形存在提示效果
    description: |
      高亮提示某个矩形范围，搜索节点或定位时会高亮提示
      关闭后会看不到矩形高亮效果
  RectanglePushInEffect:
    title: 矩形四顶点划至另一矩形四顶点的效果
    description: |
      用于提示实体的跨越框层移动、方向键切换选中
      目前开发者由于偷懒，此效果引用了四个劈砍线效果。
      若关闭了劈砍线效果，则此效果会看不见
  RectangleRenderEffect:
    title: 矩形位置提示效果
    description: |
      用于在吸附拖拽对齐时，显示实体即将吸附到的目标位置
  RectangleSplitTwoPartEffect:
    title: 矩形被切成两块的特效
    description: |
      仅存在于劈砍特效（也有可能是四块）
  TechLineEffect:
    title: （基础特效）折线段效果
    description: |
      此特效时其他特效的组成部分，若关闭则其他特效可能会受到影响
  TextRaiseEffectLocated:
    title: 固定位置的文本节点悬浮上升效果
    description: |
      文本节点悬浮上升效果，用于提示重要信息
  ViewFlashEffect:
    title: 视野闪烁效果
    description: |
      全屏闪白/闪黑等效果
      光敏癫痫症患者请关闭此选项
  ViewOutlineFlashEffect:
    title: 视野轮廓闪烁效果
    description: |
      视野轮廓闪烁效果
  ZapLineEffect:
    title: （基础特效）闪电线效果
    description: |
      此特效时其他特效的组成部分，若关闭则其他特效可能会受到影响
  MouseTipFeedbackEffect:
    title: 鼠标交互提示特效
    description: |
      在鼠标进行缩放视野等操作时，鼠标旁边会出现特效提示，例如一个变大或变小的圆圈
  RectangleSlideEffect:
    title: 矩形滑动尾翼特效
    description: |
      用于垂直方向键盘移动实体

keyBindsGroup:
  otherKeys:
    title: 未分类的快捷键
    description: |
      未分类的快捷键，
      此处若发现无翻译的无效快捷键项，可能是由于版本升级而未清理旧快捷键导致出现的残留
      可手动清理 keybinds.json 文件中的对应项
  basic:
    title: 基础快捷键
    description: |
      基本的快捷键，用于常用的功能
  camera:
    title: 摄像机控制
    description: |
      用于控制摄像机移动、缩放
  app:
    title: 应用控制
    description: |
      用于控制应用的一些功能
  ui:
    title: UI控制
    description: |
      用于控制UI的一些功能
  draw:
    title: 涂鸦
    description: |
      涂鸦相关功能
  select:
    title: 切换选择
    description: |
      使用键盘来切换选中的实体
  moveEntity:
    title: 移动实体
    description: |
      用于移动实体的一些功能
  generateTextNodeInTree:
    title: 生长节点
    description: |
      通过键盘生长节点（Xmind用户习惯）
  generateTextNodeRoundedSelectedNode:
    title: 在选中节点周围生成节点
    description: |
      按下后，在选中节点周围生成节点
  aboutTextNode:
    title: 关于文本节点
    description: |
      和文本节点相关的一切快捷键，分割、合并、创建等
  section:
    title: 分组框
    description: |
      分组框相关功能
  leftMouseModeCheckout:
    title: 左键模式切换
    description: |
      关于左键模式的切换
  edge:
    title: 连线相关
    description: |
      关于连线的一些功能
  expandSelect:
    title: 扩散选择
    description: |
      扩散选择节点相关的快捷键
  themes:
    title: 主题切换
    description: |
      切换主题相关的快捷键
  align:
    title: 对齐相关
    description: |
      关于实体对齐的一些功能
  image:
    title: 图片相关
    description: |
      关于图片的一些功能
  node:
    title: 节点相关
    description: |
      关于节点的一些功能，如嫁接、摘除等
  export:
    title: 导出操作
    description: |
      导出选中内容为各种格式，如纯文本、Markdown、Mermaid等

controlSettingsGroup:
  mouse:
    title: 鼠标设置
  touchpad:
    title: 触摸板设置
  textNode:
    title: 文本节点设置
  gamepad:
    title: 游戏手柄设置

visualSettingsGroup:
  basic:
    title: 基本设置
  background:
    title: 背景设置

keyBinds:
  straightenSelectedEdges:
    title: 拉直选中连线
    description: 将选中的曲线改为直线，多条关系保留间距。支持撤销。
  title: 快捷键绑定
  none: 未绑定快捷键
  test:
    title: 测试
    description: |
      仅用于测试快捷键自定义绑定功能功能
  reload:
    title: 重载应用
    description: |
      重载应用，重新加载当前工程文件
      等同于浏览器刷新网页
      这个功能很危险！会导致未保存的进度丢失！
  saveFile:
    title: 保存文件
    description: |
      保存当前工程文件，若当前文件是草稿则另存为
  newDraft:
    title: 新建草稿
    description: |
      新建一个草稿文件，并切换到该文件
      若当前文件未保存则无法切换
  startCollaboration:
    title: 开始协作
    description: |
      将当前舞台共享为实时协作房间
      需要登录 Graphif 账号
  joinCollaboration:
    title: 加入协作
    description: |
      使用邀请码加入协作房间
      需要登录 Graphif 账号
  leaveCollaboration:
    title: 离开协作
    description: |
      离开当前实时协作会话
  openCollaborationPanel:
    title: 协作面板
    description: |
      打开协作侧栏，查看房间信息与成员列表
  openCursorChat:
    title: 光标聊天
    description: |
      在当前鼠标位置输入一条会自动消失的协作消息
  newFileAtCurrentProjectDir:
    title: 在当前项目目录下新建文件
    description: |
      在当前项目目录下新建一个工程文件，并切换到该文件（用于快速创建文件）
      若当前文件为草稿状态存则无法创建
  openFile:
    title: 打开文件
    description: |
      选择一个曾经保存的json/prg文件并打开
  openCurrentProjectFileFolder:
    title: 打开当前工程文件所在文件夹
    description: |
      在系统文件管理器中打开当前工程文件所在的文件夹
      当前文件为草稿时不可用
  undo:
    title: 撤销
    description: 撤销上一次操作
  redo:
    title: 取消撤销
    description: 取消上一次撤销操作
  resetView:
    title: 重置视野
    description: |
      如果没有选择任何内容，则根据全部内容重置视野；
      如果有选择内容，则根据选中内容重置视野
  restoreCameraState:
    title: 恢复视野状态
    description: |
      按下后，恢复到之前按下F键时记录的摄像机位置和缩放大小
  resetCameraScale:
    title: 重置缩放
    description: 将视野缩放重置为标准大小
  cameraCenterOnSelection:
    title: 对准选中物体中心
    description: |
      将摄像机位置移动到选中物体的中心。
      如果同时选中了多个物体，那么就对准多个选中物体的外接矩形的中心；
      如果没有选中物体，则会到世界坐标原点。
  folderSection:
    title: 折叠或展开分组框
    description: 按下后选中的分组框会切换折叠或展开状态
  toggleSectionLock:
    title: 锁定/解锁分组框
    description: 切换选中分组框的锁定状态，锁定后内部物体不可移动
  setSectionBorderSolid:
    title: 设置分组框边框为实线
    description: 将选中的分组框的边框样式设置为实线
  setSectionBorderDashed:
    title: 设置分组框边框为虚线
    description: 将选中的分组框的边框样式设置为虚线
  setSectionBorderNone:
    title: 设置分组框边框为无边框
    description: 将选中的分组框的边框样式设置为无边框
  setTextNodeBorderSolid:
    title: 设置文本节点边框为实线
    description: 将选中的文本节点的边框样式设置为实线
  setTextNodeBorderDashed:
    title: 设置文本节点边框为虚线
    description: 将选中的文本节点的边框样式设置为虚线
  setTextNodeBorderNone:
    title: 设置文本节点边框为无边框
    description: 将选中的文本节点的边框样式设置为无边框
  reverseEdges:
    title: 反转连线的方向
    description: |
      按下后，选中的连线的方向会变成相反方向
      例如，原先是 A -> B，按下后变成 B -> A
      此功能的意义在于快速创建一个节点连向多个节点的情况
      因为目前的连线只能一次性做到多连一。
  createUndirectedEdgeFromEntities:
    title: 选中的实体之间创建无向连线
    description: |
      按下后，选中的两个或者多个实体之间会创建一条无向连线
  packEntityToSection:
    title: 将选中的实体打包到分组框中
    description: |
      按下后，选中的实体会自动包裹到新分组框中
  unpackEntityFromSection:
    title: 分组框拆包，转换为文本节点
    description: |
      按下后，选中的分组框中的实体会被拆包，自身转换成一个文本节点
      内部的实体将会掉落在外面
  textNodeToSection:
    title: 将选中的文本节点转换成分组框
    description: |
      按下后，选中的文本节点会被转换成分组框
      可以用于分组框的快速创建
  deleteSelectedStageObjects:
    title: 删除选中的舞台物体
    description: |
      按下后，选中的舞台物体会被删除
      舞台物体包括实体（节点和Section等独立存在的东西）和关系（节点之间的连线）
      默认是delete键，您可以改成backspace键
  editEntityDetails:
    title: 编辑选中的实体的详细信息
    description: |
      按下后，选中的实体的详细信息会被打开编辑
      只有选中的物体数量为1时才有效
  editUrlNodeLink:
    title: 编辑URL节点的链接
    description: |
      按下后，会弹出一个对话框来编辑选中的URL节点的链接地址。
  openColorPanel:
    title: 打开颜色面板快捷键
    description: |
      按下后，打开颜色面板，可以用于快速切换节点颜色
  switchDebugShow:
    title: 切换调试信息显示
    description: |
      按下后，切换调试信息显示
      调试信息显示在屏幕左上角，通常为开发者使用
      开启后，屏幕左上角将会显示调试信息。
      若您遇到bug截图反馈时，建议开启此选项。
  generateNodeTreeWithDeepMode:
    title: 生长子级节点
    description: |
      按下后，瞬间生长一个节点并放置在当前选中节点的右侧
      如果对节点设置了生长方向，则会按照生长方向生长子节点（若无设置则默认向右生长）
      同时自动排版整个节点树的结构，确保其是一个向右的树型结构
      使用此功能前先确保已选中一个节点、且该节点所在结构为树形结构
  generateNodeTreeWithDeepModeEditEdge:
    title: 生长子级节点并编辑连线文字
    description: |
      按下后，先按e再按tab，瞬间生长一个节点并放置在当前选中节点的右侧
      先进入连线文字的编辑状态，编辑完成后自动进入新节点的文字编辑状态
      如果是穿针连接已有节点，则只创建连线并进入连线文字编辑状态
      默认快捷键说明：先按一下e，再按一下tab。这里的e表示Edge，边
  generateNodeTreeWithBroadMode:
    title: 生长同级节点
    description: |
      按下后，瞬间生长一个同级节点并放置在当前选中节点的下方
      同时自动排版整个节点树的结构，确保其是一个向下的树型结构
      使用此功能前先确保已选中一个节点、且该节点存在父级节点
  generateNodeGraph:
    title: 生长自由节点
    description: |
      按住此键，出现一个虚拟生长位置
      此时，按住”I J K L”键自由调整生长位置
      松开此键，完成节点创建
      使用此功能前先确保已选中一个节点
      默认快捷键说明：I J K L 是类 拳皇风格的方向键，I=上、J=左、K=下、L=右，与右手食指到小指的键位对应
  generateNodeGraphMoveUp:
    title: 自由生长节点——向上移动
    description: |
      在自由生长节点模式激活时（按住反引号键），按住此键将虚拟目标位置向上移动
  generateNodeGraphMoveDown:
    title: 自由生长节点——向下移动
    description: |
      在自由生长节点模式激活时（按住反引号键），按住此键将虚拟目标位置向下移动
  generateNodeGraphMoveLeft:
    title: 自由生长节点——向左移动
    description: |
      在自由生长节点模式激活时（按住反引号键），按住此键将虚拟目标位置向左移动
  generateNodeGraphMoveRight:
    title: 自由生长节点——向右移动
    description: |
      在自由生长节点模式激活时（按住反引号键），按住此键将虚拟目标位置向右移动
  createConnectPointWhenDragConnecting:
    title: 拖拽连线时，按下此键，创建质点中转
    description: |
      当拖拽连线时，按下此键，创建质点中转
  treeGraphAdjust:
    title: 调整当前节点所在树形结构的树形排布
    description: |
      主要用于关闭了键盘生长节点时触发的树形排布调整时使用
      可以通过此快捷键手动触发布局调整
  treeGraphAdjustSelectedAsRoot:
    title: 以选中节点为根节点格式化树形结构
    description: |
      以当前选中的节点作为根节点进行树形结构格式化
      不会查找整个树的根节点，只格式化以选中节点为根的子树
  treeGraphAdjustSelectedAsRootToLeft:
    title: 以选中节点为根，将子树整体调整到左侧
    description: |
      将选中节点视为子树根节点。
      把子树内部所有连线，以及指向该根节点的父连线都改成左连线，
      然后自动格式化树形结构，让整个子树调整到左边。
  treeGraphAdjustSelectedAsRootToRight:
    title: 以选中节点为根，将子树整体调整到右侧
    description: |
      将选中节点视为子树根节点。
      把子树内部所有连线，以及指向该根节点的父连线都改成右连线，
      然后自动格式化树形结构，让整个子树调整到右边。
  treeGraphAdjustSelectedAsRootToUp:
    title: 以选中节点为根，将子树整体调整到上侧
    description: |
      将选中节点视为子树根节点。
      把子树内部所有连线，以及指向该根节点的父连线都改成上连线，
      然后自动格式化树形结构，让整个子树调整到上方。
  treeGraphAdjustSelectedAsRootToDown:
    title: 以选中节点为根，将子树整体调整到下侧
    description: |
      将选中节点视为子树根节点。
      把子树内部所有连线，以及指向该根节点的父连线都改成下连线，
      然后自动格式化树形结构，让整个子树调整到下方。
  dagGraphAdjust:
    title: 调整当前选中节点群的DAG布局
    description: |
      对选中的有向无环图（DAG）结构进行自动布局调整
      仅当选中节点构成DAG结构时可用
  setNodeTreeDirectionLeft:
    title: 设置当前节点的树形生长方向为向左
    description: |
      需要选中节点后按下此快捷键
      设置后，在此节点上按Tab生长时，会向左生长子节点
  setNodeTreeDirectionRight:
    title: 设置当前节点的树形生长方向为向右
    description: |
      需要选中节点后按下此快捷键
      设置后，在此节点上按Tab生长时，会向右生长子节点
  setNodeTreeDirectionUp:
    title: 设置当前节点的树形生长方向为向上
    description: |
      需要选中节点后按下此快捷键
      设置后，在此节点上按Tab生长时，会向上生长子节点
  setNodeTreeDirectionDown:
    title: 设置当前节点的树形生长方向为向下
    description: |
      需要选中节点后按下此快捷键
      设置后，在此节点上按Tab生长时，会向下生长子节点

  masterBrakeCheckout:
    title: 手刹：开启/关闭通过按键控制摄像机移动
    description: |
      按下后会切换是否允许 “W S A D”键控制摄像机移动
      可以用于临时禁止摄像机移动，在输入秘籍键或含有WSAD的快捷键时防止视野移动
  masterBrakeControl:
    title: 脚刹：停止摄像机飘移
    description: |
      按下后，停止摄像机飘移，并将速度置为0
  selectAll:
    title: 全选
    description: 按下后，所有节点和连线都会被选中
  selectAtCrosshair:
    title: 选择十字准心对准的节点
    description: |
      选择屏幕中心十字准心指向的节点
      如果该位置有节点，则选中它（取消其他选择）
  addSelectAtCrosshair:
    title: 添加选择十字准心对准的节点
    description: |
      将屏幕中心十字准心指向的节点添加到当前选择中
      如果该节点已被选中，则取消选中
  generateTreeBySelectedTextNodeTextWithAI:
    title: AI：生成树形结构
    description: |
      将选中的文本节点内容填入 AI 面板，并预置提示词用于生成树形节点图
  generateNetBySelectedTextNodeTextWithAI:
    title: AI：生成网状关系图
    description: |
      将选中的文本节点内容填入 AI 面板，并预置提示词用于生成网状关系图
  generateSummaryBySelectedTextNodeTextWithAI:
    title: AI：生成摘要
    description: |
      将选中的文本节点内容填入 AI 面板，并预置提示词用于总结核心内容
  createTextNodeFromCameraLocation:
    title: 在视野中心位置创建文本节点
    description: |
      按下后，在当前视野中心的位置创建一个文本节点
      等同于鼠标双击创建节点的功能
  createTextNodeFromMouseLocation:
    title: 在鼠标位置创建文本节点
    description: |
      按下后，在鼠标悬浮位置创建一个文本节点
      等同于鼠标单击创建节点的功能
  createTextNodeFromSelectedTop:
    title: 在当前选中的节点正上方创建文本节点
    description: |
      按下后，在当前选中的节点正上方创建一个文本节点
  createTextNodeFromSelectedDown:
    title: 在当前选中的节点正下方创建文本节点
    description: |
      按下后，在当前选中的节点正下方创建一个文本节点
  createTextNodeFromSelectedLeft:
    title: 在当前选中的节点左侧创建文本节点
    description: |
      按下后，在当前选中的节点左侧创建一个文本节点
  createTextNodeFromSelectedRight:
    title: 在当前选中的节点右侧创建文本节点
    description: |
      按下后，在当前选中的节点右侧创建一个文本节点
  selectUp:
    title: 选中上方节点
    description: 按下后，选中上方节点
  selectDown:
    title: 选中下方节点
    description: 按下后，选中下方节点
  selectLeft:
    title: 选中左侧节点
    description: 按下后，选中左侧节点
  selectRight:
    title: 选中右侧节点
    description: 按下后，选中右侧节点
  selectAdditionalUp:
    title: 附加选中上方节点
    description: 按下后，附加选中上方节点
  selectAdditionalDown:
    title: 附加选中下方节点
    description: 按下后，附加选中下方节点
  selectAdditionalLeft:
    title: 附加选中左侧节点
    description: 按下后，附加选中左侧节点
  selectAdditionalRight:
    title: 附加选中右侧节点
    description: 按下后，附加选中右侧节点
  moveUpSelectedEntities:
    title: 向上移动所有选中的实体
    description: |
      持续按住时，所有选中的实体会持续向上加速移动，松开后缓动停止
  moveDownSelectedEntities:
    title: 向下移动所有选中的实体
    description: |
      持续按住时，所有选中的实体会持续向下加速移动，松开后缓动停止
  moveLeftSelectedEntities:
    title: 向左移动所有选中的实体
    description: |
      持续按住时，所有选中的实体会持续向左加速移动，松开后缓动停止
  moveRightSelectedEntities:
    title: 向右移动所有选中的实体
    description: |
      持续按住时，所有选中的实体会持续向右加速移动，松开后缓动停止
  jumpMoveUpSelectedEntities:
    title: 跳跃向上移动所有选中的实体
    description: |
      按下后，所有选中的实体会跳跃向上移动一个固定距离，能够跳入或者跳出分组框
  jumpMoveDownSelectedEntities:
    title: 跳跃向下移动所有选中的实体
    description: |
      按下后，所有选中的实体会跳跃向下移动一个固定距离，能够跳入或者跳出分组框
  jumpMoveLeftSelectedEntities:
    title: 跳跃向左移动所有选中的实体
    description: |
      按下后，所有选中的实体会跳跃向左移动一个固定距离，能够跳入或者跳出分组框
  jumpMoveRightSelectedEntities:
    title: 跳跃向右移动所有选中的实体
    description: |
      按下后，所有选中的实体会跳跃向右移动一个固定距离，能够跳入或者跳出分组框
  CameraScaleZoomIn:
    title: 视野放大
    description: 按下后，视野放大
  CameraScaleZoomOut:
    title: 视野缩小
    description: 按下后，视野缩小
  CameraPageMoveUp:
    title: 视野向上翻页式移动
  CameraPageMoveDown:
    title: 视野向下翻页式移动
  CameraPageMoveLeft:
    title: 视野向左翻页式移动
  CameraPageMoveRight:
    title: 视野向右翻页式移动
  exitSoftware:
    title: 退出软件
    description: 按下后，退出软件
  checkoutProtectPrivacy:
    title: 进入或退出隐私保护模式
    description: |
      按下后，舞台上的全部文字将会被加密，无法被其他人看到
      按下后，舞台上的全部文字将会解密，其他人可以看到
      可以用于截图反馈问题、突然有人看你的屏幕时使用并且你的内容是感情问题（？）时使用
  openTextNodeByContentExternal:
    title: 以网页浏览器或本地文件形式打开选中节点的内容
    description: |
      按下后，舞台上所有选中的文本节点都会被以默认方式或浏览器方式打开。
      例如一个节点内容为 "D:/Desktop/a.txt"，选中此节点按下快捷键之后，能以系统默认方式打开此文件
      如果节点内容为网页地址 "https://project-graph.top"，会以系统默认浏览器打开网页内容
  checkoutClassroomMode:
    title: 进入或退出专注模式
    description: |
      按下后，进入专注模式，所有UI都会隐藏，顶部按钮会透明化处理
      再按一次恢复
  checkoutWindowOpacityMode:
    title: 切换窗口透明度模式
    description: |
      按下后，窗口进入完全透明模式，再按一次将进入完全不透明模式
      注意要配合舞台颜色风格进行设置。例如：黑色模式下文字为白色，论文白模式下文字为黑色。
      如果窗口下层内容为白色背景，建议切换舞台到论文白模式。
  windowOpacityAlphaIncrease:
    title: 窗口不透明度增加
    description: |
      按下后，窗口不透明度（alpha）值增加0.2，往不透明的方向改变，最大值为1
      当不能再增加时，会有窗口边缘闪烁提示
  windowOpacityAlphaDecrease:
    title: 窗口不透明度减小
    description: |
      按下后，窗口不透明度（alpha）值减小0.2，往透明的方向改变，最小值为0
      如果您的键盘没有小键盘的纯减号键，可以改成横排数字0右侧的减号与下划线公用键
  searchText:
    title: 搜索文本
    description: |
      按下后，打开搜索框，可以输入搜索内容
      搜索框支持部分匹配，例如输入 "a" 能搜索到 "apple" 等
  clickAppMenuSettingsButton:
    title: 打开设置页面
    description: |
      按下此键可代替鼠标点击菜单栏里的设置界面按钮
  clickTagPanelButton:
    title: 打开/关闭标签面板
    description: |
      按下此键可代替鼠标点击页面上的标签面板展开关闭按钮
  openOutlineWindow:
    title: 打开大纲
    description: |
      打开大纲面板，查看画布中各关联结构的图论类型
  clickAppMenuRecentFileButton:
    title: 打开最近打开文件列表
    description: |
      按下此键可代替鼠标点击菜单栏里的最近打开文件列表按钮
  clickStartFilePanelButton:
    title: 打开/关闭启动文件列表
    description: |
      按下此键可代替鼠标点击菜单栏里的启动文件列表展开关闭按钮
  copy:
    title: 复制
    description: 按下后，复制选中的内容
  cut:
    title: 剪切
    description: 按下后，复制选中的内容并删除，撤销一次即可恢复
  paste:
    title: 粘贴
    description: 按下后，粘贴剪贴板内容
  changeTagBySelected:
    title: 添加或删除标签
    description: 按下后，为所有选中的实体添加或移除标签
  pasteWithOriginLocation:
    title: 原位粘贴
    description: 按下后，粘贴的内容会与原位置重叠
  selectEntityByPenStroke:
    title: 涂鸦与实体的扩散选择
    description: |
      选中一个涂鸦或者实体后，按下此键，会扩散选择该实体周围的实体
      如果当前选择的是涂鸦，则扩散选择涂鸦触碰到的实体
      如果当前选择的是实体，则扩散选触碰到的所有涂鸦
      多次按下后可以多次交替扩散
  expandSelectEntity:
    title: 扩散选择节点
    description: |
      按下后，实体的选择状态会转移到子级节点上
  expandSelectEntityReversed:
    title: 反向扩散选择节点
    description: |
      按下后，实体的选择状态会转移到父级节点上
  expandSelectEntityKeepLastSelected:
    title: 扩散选择节点（保留当前节点的选择状态）
    description: |
      按下后，实体的选择状态会转移到子级节点上，同时保留当前节点的选择状态
  expandSelectEntityReversedKeepLastSelected:
    title: 反向扩散选择节点（保留当前节点的选择状态）
    description: |
      按下后，实体的选择状态会转移到父级节点上，同时保留当前节点的选择状态
  expandSelectEntityWithEdge:
    title: 扩散选择节点与连线
    description: |
      按下后，选择状态会沿着连线逐步扩散。
      正向扩散时，会在“节点 -> 出边 -> 子节点”之间交替前进。
  expandSelectEntityReversedWithEdge:
    title: 反向扩散选择节点与连线
    description: |
      按下后，选择状态会沿着连线逐步反向扩散。
      反向扩散时，会在“节点 -> 入边 -> 父节点”之间交替前进。
  expandSelectEntityKeepLastSelectedWithEdge:
    title: 扩散选择节点与连线（保留当前选择）
    description: |
      按下后，选择状态会沿着连线逐步扩散。
      正向扩散时，会在“节点 -> 出边 -> 子节点”之间交替前进，同时保留当前选择。
  expandSelectEntityReversedKeepLastSelectedWithEdge:
    title: 反向扩散选择节点与连线（保留当前选择）
    description: |
      按下后，选择状态会沿着连线逐步反向扩散。
      反向扩散时，会在“节点 -> 入边 -> 父节点”之间交替前进，同时保留当前选择。
  CameraMoveUp:
    title: 向上移动视野
    description: 按下后，视野向上移动
  CameraMoveDown:
    title: 向下移动视野
    description: 按下后，视野向下移动
  CameraMoveLeft:
    title: 向左移动视野
    description: 按下后，视野向左移动
  CameraMoveRight:
    title: 向右移动视野
    description: 按下后，视野向右移动
  continuousShortcut:
    title: 持续型快捷键
  continuousShortcutTooltip:
    title: 持续型快捷键说明
    description: 需要持续按下，然后一小段时间松开才感觉到效果的快捷键。并且不像序列型快捷键那样长度可以是一个按键序列。
  resetToDefault:
    title: 重置为默认
  checkoutLeftMouseToSelectAndMove:
    title: 设置左键为“选中/移动”模式
    description: |
      也就是鼠标左键切换为正常模式
  checkoutLeftMouseToDrawing:
    title: 设置左键为“涂鸦”模式
    description: |
      也就是鼠标左键切换为涂鸦模式，在工具栏中有对应按钮
  checkoutLeftMouseToConnectAndCutting:
    title: 设置左键为“连线/斩断”模式
    description: |
      也就是鼠标左键切换为连线/斩断 模式，在工具栏中有对应按钮
  checkoutLeftMouseToConnectAndCuttingOnlyPressed:
    title: 设置左键为“连线/斩断”模式（仅按下时）

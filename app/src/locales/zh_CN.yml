    preview: 预览
    previewTitle: PDE-Refiner 复现笔记
    previewBody: |
      > [!abstract] 一句话
      > 用多步细化把长时间滚动预测的误差压下去。

      ## 方法

      每一步先**加一点噪声**，再让网络预测去噪后的结果，相当于一个很短的扩散过程。公式是 $\hat u_{t+1} = f_\theta(u_t)$。

      | 方法 | 滚动步数 | 相对误差 |
      |---|---|---|
      | MSE 基线 | 80 | 0.32 |
      | PDE-Refiner | 160 | 0.11 |

      代码里关键的一行：`loss = mse(model(x + noise), x)`

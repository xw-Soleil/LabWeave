welcome:
  aboutDescription: 用节点连接想法，用图谱整理知识。Project Graph 为头脑风暴、知识管理和项目规划提供自由画布，通过连线与自动布局，让复杂思路变得清晰。
  slogan: 基于图论的思维框架图绘制软件
  slogans:
    - 基于图论的思维框架图绘制软件
    - 在无限大的平面上发挥你的设计
    - 让思维在节点与连线间自由流动
    - 用图论思想构建你的知识网络
    - 从混沌到秩序，从节点到体系
    - 可视化思维，拓扑化管理
    - 无限画布，无限可能
    - 连接点滴想法，绘制宏观蓝图
    - 不只是思维导图，更是思维框架
    - 图论驱动的视觉思考工具
